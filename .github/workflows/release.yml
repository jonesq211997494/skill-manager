name: Publish Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version."
          }
          if (-not (Test-Path "docs/releases/v$version.md")) {
            throw "Missing release notes: docs/releases/v$version.md"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test, build, package and verify
        run: npm run package:verified

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            "release/Skill-Manager-$env:VERSION-setup-x64.exe",
            "release/Skill-Manager-$env:VERSION-portable.exe",
            "release/SHA256SUMS-$env:VERSION.txt"
          )
          $missing = $assets | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Missing release asset(s): $($missing -join ', ')"
          }

          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $assets --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" $assets --repo "$env:GITHUB_REPOSITORY" --title "Skill Manager $env:VERSION" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          }
