name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Core tests and machine report
        run: npm run test:ci
      - name: TypeScript and UI build
        run: npm run build
      - name: Isolated desktop regression
        run: npm run test:desktop
      - name: Renderer security and shutdown
        run: npm run test:security
      - name: Operation result UI regression
        run: npm run test:results-ui
      - name: Detail and scan state regression
        run: npm run test:ui-state
      - name: Build Windows installer and portable app
        run: npm run package
      - name: Verify packaged app and checksums
        run: npm run test:package
      - name: Sanitize local evidence and record environment
        if: always()
        run: npm run test:evidence
      # 产物上传需另行确认；本工作流不发布报告或截图附件。
